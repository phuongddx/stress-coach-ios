name: Build

# Build-only gate. Compiles the app, the embedded watch app and the test
# target (build-for-testing) without running tests — the fast signal that a
# change compiles, on every push. Full lint + build + test lives in ci.yml,
# which only runs on pull requests.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.3"
  SCHEME: "StressMonitor"
  LANG: "en_US.UTF-8"

jobs:
  build:
    name: Build iOS (app + tests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # The StressMonitor scheme embeds the watch app, so xcodebuild refuses to
      # build it without a watchOS simulator runtime installed.
      - name: Ensure watchOS Simulator runtime
        run: |
          if ! xcodebuild -showdestinations -project StressMonitor/StressMonitor.xcodeproj -scheme "$SCHEME" 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "watchOS Simulator runtime missing — downloading..."
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Build app and test target
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
