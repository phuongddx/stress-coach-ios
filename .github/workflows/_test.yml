name: _test  # Reusable — called by ci.yml and deploy.yml

on:
  workflow_call:

env:
  XCODE_VERSION: "26.3"
  SCHEME: "StressMonitor"
  LANG: "en_US.UTF-8"

jobs:
  # PR CI asks for three macOS runners: this job, Test below and ci.yml's
  # "Release Build (Xcode 27.2)". Each configuration is compiled once:
  #
  # - Test builds Debug for the iOS Simulator (build-for-testing). The
  #   StressMonitor scheme embeds the watch app and the widget extension, so
  #   that one build compiles all three targets; the old separate iOS, watchOS
  #   and widget Debug builds compiled the same sources again on this runner.
  # - Lint & Build runs SwiftLint and builds Release for devices with Xcode
  #   26.3 (iOS app with the watch app and the widget embedded).
  #
  # Both jobs check that the watch app and the widget really are embedded in
  # the product they built. The watchOS and Widget required checks are the
  # small ubuntu jobs further down, which pass only when both jobs report
  # their target built. Later steps run even when an earlier one fails, so each
  # check still says what broke.
  lint-and-build:
    name: Lint & Build
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      watchos: ${{ steps.embedded.outputs.watchos }}
      widget: ${{ steps.embedded.outputs.widget }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      - name: Xcode cache
        uses: ./.github/actions/xcode-cache
        with:
          job-key: lint-build
          # Release objects differ from main's Debug entry, so restoring it buys nothing.
          compilation-cache: "false"

      - name: Run SwiftLint
        run: |
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --reporter github-actions-logging || true

      - name: Ensure iOS platform
        run: |
          if ! xcodebuild -showdestinations -project StressMonitor/StressMonitor.xcodeproj -scheme "$SCHEME" 2>/dev/null | grep -q "platform:iOS,"; then
            echo "No eligible iOS platform found — downloading..."
            xcodebuild -downloadPlatform iOS
          fi

      # Compiles the Release configuration with Xcode 26.3, the older SDK the
      # iOS 18.6 fallback path builds against. Catches Release-only compile
      # errors before merge, such as a #Preview that uses a DEBUG-only symbol
      # (Xcode Cloud Beta run 53 failed to archive on PlanCard.previewAnnual
      # while the PR was green). Needs no secrets: GoogleService-Info.plist is
      # optional at build time and signing is off. The Xcode 27.x Release build
      # is ci.yml's "Release Build (Xcode 27.2)" check.
      - name: Build Release (Xcode 26.3)
        id: release
        run: |
          set -o pipefail
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Verify Plus StoreKit keys in the Release Info.plist
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: scripts/ci/verify-plus-storekit-keys.sh build/Build/Products/Release-iphoneos/StressMonitor.app

      - name: Check the watch app and widget are embedded (Release, device)
        id: embedded
        if: ${{ !cancelled() }}
        run: scripts/ci/check-embedded-targets.sh build/Build/Products/Release-iphoneos/StressMonitor.app "${{ steps.release.outcome }}"

  # Required check names on main. They run no build: each passes only when
  # both Lint & Build (Release, device) and Test (Debug, simulator) built the
  # target and embedded it in the app. "upstream-not-run" tells
  # scripts/ci-rerun-infra.sh that a macOS job never ran (for example no runner
  # was free), so a re-run is safe; any other failure is a real build failure.
  build-watchos:
    name: Build watchOS
    needs: [lint-and-build, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Report the watchOS builds from Lint & Build and Test
        env:
          RELEASE: ${{ needs.lint-and-build.outputs.watchos }}
          DEBUG: ${{ needs.test.outputs.watchos }}
          UPSTREAM: "Lint & Build: ${{ needs.lint-and-build.result }}, Test: ${{ needs.test.result }}"
        run: scripts/ci/report-target-check.sh "watch app" "$RELEASE" "$DEBUG" "$UPSTREAM"

  build-widget:
    name: Build Widget
    needs: [lint-and-build, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Report the widget builds from Lint & Build and Test
        env:
          RELEASE: ${{ needs.lint-and-build.outputs.widget }}
          DEBUG: ${{ needs.test.outputs.widget }}
          UPSTREAM: "Lint & Build: ${{ needs.lint-and-build.result }}, Test: ${{ needs.test.result }}"
        run: scripts/ci/report-target-check.sh "widget extension" "$RELEASE" "$DEBUG" "$UPSTREAM"

  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      watchos: ${{ steps.embedded.outputs.watchos }}
      widget: ${{ steps.embedded.outputs.widget }}
    env:
      TEST_DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      - name: Xcode cache
        uses: ./.github/actions/xcode-cache
        with:
          job-key: test
          restore-from: build   # main saves only the Build job's entry

      # The StressMonitor scheme embeds the watch app, so xcodebuild needs a
      # watchOS Simulator runtime to build it (same guard as build.yml).
      - name: Ensure watchOS Simulator runtime
        run: |
          if ! xcodebuild -showdestinations -project StressMonitor/StressMonitor.xcodeproj -scheme "$SCHEME" 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "watchOS Simulator runtime missing — downloading..."
            xcodebuild -downloadPlatform watchOS
          fi

      # One Debug simulator build of the iOS app, the embedded watch app, the
      # widget extension and the test bundle.
      - name: Build iOS, watchOS and widget (Debug, simulator)
        id: build
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # XCODE_CACHE_ARGS is split into build settings on purpose
          xcodebuild build-for-testing \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$TEST_DESTINATION" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            $XCODE_CACHE_ARGS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee raw-build-output.log | xcbeautify --renderer github-actions

      - name: Verify Plus StoreKit keys in merged Info.plist
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/ci/verify-plus-storekit-keys.sh build/Build/Products/Debug-iphonesimulator/StressMonitor.app

      - name: Check the watch app and widget are embedded (Debug, simulator)
        id: embedded
        if: ${{ !cancelled() }}
        run: scripts/ci/check-embedded-targets.sh build/Build/Products/Debug-iphonesimulator/StressMonitor.app "${{ steps.build.outcome }}"

      # No CI-only test gate: the past CI host stall was a SwiftData
      # container-lifetime bug in test fixtures (now kept alive per test).
      - name: Run Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$TEST_DESTINATION" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            2>&1 | tee raw-test-output.log | xcbeautify --renderer github-actions

      # The console counts XCTest and Swift Testing separately; the result
      # bundle is the one place with the combined totals and the names of the
      # failed and skipped tests.
      - name: Summarize test results
        if: always()
        run: scripts/ci/summarize-test-results.sh TestResults.xcresult | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload raw build and test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-output
          path: |
            raw-build-output.log
            raw-test-output.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 5
