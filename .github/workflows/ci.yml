name: CI

on:
  pull_request:
    branches: [main, develop, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    uses: ./.github/workflows/_test.yml

  # Xcode Cloud archives the App Store and TestFlight build with Xcode 27.2
  # (27.1 was the first SDK with the iPhone Duo APIs, code behind
  # `#if canImport(SwiftUI, _version: 8.0.85)`). This compiles that path in
  # Release on every PR with the same Xcode. The Lint & Build jobs stay on
  # Xcode 26.3 (and build Release there too) so the older-SDK fallback (iOS 18.6
  # target) still builds.
  release-build-xcode27:
    name: Release Build (Xcode 27.2)
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      XCODE_VERSION: "27.2"
      SCHEME: "StressMonitor"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.x (prefer ${{ env.XCODE_VERSION }})
        run: |
          # Prefer Xcode_${XCODE_VERSION}, else the newest stable 27.x. Runner
          # images rotate Xcode builds and may ship only a beta (Xcode_27.3.app
          # can be a symlink to Xcode_27.3_beta.app), so resolve links and skip
          # beta names and beta build numbers (they end in a letter).
          pick=""
          for app in /Applications/Xcode_${XCODE_VERSION}.app $(ls -d /Applications/Xcode_27.*.app 2>/dev/null | sort -rV); do
            real=$(cd "$app" 2>/dev/null && pwd -P) || continue
            build=$(/usr/libexec/PlistBuddy -c "Print :ProductBuildVersion" "$real/Contents/version.plist" 2>/dev/null) || continue
            case "$real$build" in *[Bb]eta*|*[a-z]) continue ;; esac
            pick=$real; break
          done
          if [ -z "$pick" ]; then
            echo "::error::No stable Xcode 27.x on this runner image"; ls -d /Applications/Xcode*; exit 1
          fi
          picked=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$pick/Contents/Info.plist")
          case "$picked" in
            "$XCODE_VERSION"|"$XCODE_VERSION".*) echo "Selected Xcode $picked at $pick (build $build)" ;;
            *) echo "::warning title=Xcode fallback::Xcode $XCODE_VERSION is not on this runner image; built with Xcode $picked ($pick, build $build), the newest stable 27.x." ;;
          esac
          sudo xcode-select -s "$pick/Contents/Developer"
          xcodebuild -version
          ls /Applications | grep Xcode
          xcodebuild -showsdks | grep -E "iphoneos|watchos"

      - name: Restore Xcode caches
        uses: ./.github/actions/xcode-cache
        with:
          job-key: release-xcode27
          # Release objects differ from main's Debug entry, so restoring it buys nothing.
          compilation-cache: "false"

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      # Same guards as _test.yml (Lint & Build: iOS, Test: watchOS) and build.yml:
      # the StressMonitor scheme embeds the watch app, so xcodebuild needs the
      # watchOS platform installed too.
      - name: Ensure iOS and watchOS platforms
        run: |
          if ! xcodebuild -showdestinations -project StressMonitor/StressMonitor.xcodeproj -scheme "$SCHEME" 2>/dev/null | grep -q "iOS"; then
            echo "No eligible iOS platform found — downloading..."
            xcodebuild -downloadPlatform iOS
          fi
          if ! xcodebuild -showdestinations -project StressMonitor/StressMonitor.xcodeproj -scheme "$SCHEME" 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "watchOS Simulator runtime missing — downloading..."
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Build Release
        run: |
          set -o pipefail
          # XCODE_CACHE_ARGS holds build settings; split them into words.
          # shellcheck disable=SC2086
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            $XCODE_CACHE_ARGS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

  # Posts only on failure (passing PRs stay quiet). Fork PRs get no secrets,
  # so the step skips itself when the webhook is empty.
  notify-failure:
    name: Notify Slack on failure
    needs: [build, release-build-xcode27]
    if: failure()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Post CI failure
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ${{ toJSON(format('❌ CI failed · {0} · {1}/{2}/actions/runs/{3}', github.event.pull_request && format('PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || github.ref_name, github.server_url, github.repository, github.run_id)) }}
