name: CI re-run on runner shortage

# When GitHub cannot hand a CI job a macOS runner ("The job was not acquired by
# Runner of type hosted even after multiple attempts"), the job ends cancelled
# and the PR goes red although no code failed. This re-runs the failed jobs of
# that CI run, at most twice (run_attempt 1 and 2). Real build or test
# failures, runs a newer push superseded, and runs cancelled by hand are left
# alone. The decision logic lives in scripts/ci-rerun-infra.sh.
#
# workflow_run workflows run from the default branch, so edits here take
# effect only after they reach main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write   # gh run rerun, list runs and jobs
  checks: read     # job annotations ("not acquired by Runner")
  contents: read   # check out the script (default branch only)

jobs:
  rerun:
    name: Re-run jobs that got no runner
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-rerun-infra.sh
          sparse-checkout-cone-mode: false

      - name: Decide and re-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: scripts/ci-rerun-infra.sh "$RUN_ID" "$RUN_ATTEMPT"
