name: Xcode cache
description: >-
  Restores (and, in the post step, saves) the SwiftPM checkouts and the Xcode 26
  compilation cache from the paths `xcodebuild -derivedDataPath <dd>` really uses,
  and exports XCODE_CACHE_ARGS for callers to append to xcodebuild.

# Usage (after Checkout and Select Xcode):
#   - uses: ./.github/actions/xcode-cache
#     with:
#       job-key: test
#   - run: xcodebuild build ... -derivedDataPath build $XCODE_CACHE_ARGS ...
#
# Saving happens in the post steps of the nested actions/cache steps (only when
# the job succeeds). Callers do nothing else.

inputs:
  job-key:
    description: Unique per job (lint-build, watchos, widget, test, build, release, agent-verify). Scopes the compilation cache.
    required: true
  derived-data-path:
    description: The -derivedDataPath the job passes to xcodebuild.
    required: false
    default: build

outputs:
  spm-hit:
    description: '"true" on an exact SwiftPM key hit, otherwise "false".'
    value: ${{ steps.spm.outputs.cache-hit == 'true' }}
  compilation-hit:
    description: '"true" when a compilation cache was restored (exact or prefix match), otherwise "false".'
    # actions/cache (unlike actions/cache/restore) has no cache-matched-key output;
    # its cache-hit is "true" on an exact hit, "false" on a restore-keys match and
    # empty on a miss, so non-empty means something was restored.
    value: ${{ steps.xcc.outputs.cache-hit != '' }}

runs:
  using: composite
  steps:
    # SwiftPM: with -derivedDataPath, packages live in <dd>/SourcePackages, not in
    # ~/Library/Developer/Xcode/DerivedData. Both Package.resolved files feed the key:
    # the app project's and the local proxy package that builds Firebase + GoogleSignIn.
    # Shared by every job.
    - name: Cache SwiftPM packages
      id: spm
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.derived-data-path }}/SourcePackages/checkouts
          ${{ inputs.derived-data-path }}/SourcePackages/repositories
        key: spm-v1-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'StressMonitor/spm-cache/packages/proxy/Package.resolved') }}
        restore-keys: |
          spm-v1-${{ runner.os }}-

    # --- Compilation cache (drop this step and "Enable compilation caching" to remove it) ---
    # Xcode 26 content-addressed compilation caching (COMPILATION_CACHE_ENABLE_CACHING=YES).
    # Location: for scheme builds with a derived data path, swift-build sets
    #   COMPILATION_CACHE_CAS_PATH = $(DERIVED_DATA_DIR)/CompilationCache.noindex
    # i.e. <dd>/CompilationCache.noindex. Source (swift-build release/6.2, the build
    # system in Xcode 26):
    #   https://github.com/swiftlang/swift-build/blob/3144d7bde72347a18e0cacc0655a3e6d5976ec09/Sources/SWBCore/Settings/Settings.swift#L2001-L2002
    # Also documented by Tuist: https://tuist.dev/en/docs/guides/features/cache/xcode-cache
    # Restoring it across runs relies on identical absolute paths (module cache dir,
    # bridging header), which GitHub-hosted runners keep stable:
    #   https://forums.swift.org/t/about-swift-shared-cache-across-machines/81850
    # SwiftPM package targets: the setting is passed on the command line, so it reaches
    # package targets too, but whether they produce cache hits on Xcode 26.3 is
    # unconfirmed (verify on first run).
    - name: Cache compilation results
      id: xcc
      uses: actions/cache@v4
      with:
        path: ${{ inputs.derived-data-path }}/CompilationCache.noindex
        key: xcc-v1-${{ runner.os }}-${{ inputs.job-key }}-${{ github.sha }}
        restore-keys: |
          xcc-v1-${{ runner.os }}-${{ inputs.job-key }}-

    - name: Enable compilation caching
      shell: bash
      run: echo "XCODE_CACHE_ARGS=COMPILATION_CACHE_ENABLE_CACHING=YES" >> "$GITHUB_ENV"
    # --- end compilation cache ---

    - name: Report cache status
      shell: bash
      env:
        DD: ${{ inputs.derived-data-path }}
        JOB_KEY: ${{ inputs.job-key }}
        SPM_HIT: ${{ steps.spm.outputs.cache-hit }}
        XCC_HIT: ${{ steps.xcc.outputs.cache-hit }}
      run: |
        status() {
          case "$1" in
            true) echo "hit (exact key)" ;;
            false) echo "partial (restored from restore-keys prefix)" ;;
            *) echo "miss (cold)" ;;
          esac
        }
        size() {
          if [ -d "$1" ]; then du -sh "$1" | cut -f1; else echo "absent"; fi
        }
        {
          echo "xcode-cache [$JOB_KEY]"
          echo "  SwiftPM:     $(status "$SPM_HIT")"
          echo "    $DD/SourcePackages/checkouts:     $(size "$DD/SourcePackages/checkouts")"
          echo "    $DD/SourcePackages/repositories:  $(size "$DD/SourcePackages/repositories")"
          echo "  Compilation: $(status "$XCC_HIT")"
          echo "    $DD/CompilationCache.noindex:     $(size "$DD/CompilationCache.noindex")"
          echo "  XCODE_CACHE_ARGS=${XCODE_CACHE_ARGS:-<empty>}"
        } | tee -a "$GITHUB_STEP_SUMMARY"
